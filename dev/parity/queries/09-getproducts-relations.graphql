# The core maximum price of a downloadable product includes its link prices
# only when links_purchased_separately is loaded on the model, so the stock
# path gives a different price for the same product without this selection.
# The document path always includes them. The selection sits outside the
# fragment: core cannot join an inline fragment inside a linked products field.
fragment ProductPiece on ProductInterface {
  uid
  name
  price_range {
    maximum_price { discount { amount_off percent_off } final_price { currency value } regular_price { currency value } }
    minimum_price { discount { amount_off percent_off } final_price { currency value } regular_price { currency value } }
  }
  thumbnail { disabled label position url }
  quantity
  max_sale_qty
  media_gallery { disabled label position url }
  quantity
  url_suffix
  url_rewrites { url }
  description { html }
}
query GetProducts {
  products(filter: {}) {
    items {
      __typename
      ... on DownloadableProduct { links_purchased_separately }
      ... on ConfigurableProduct { configurable_options { attribute_code } }
      ...ProductPiece
      related_products { ...ProductPiece }
      upsell_products { ...ProductPiece }
      crosssell_products { ...ProductPiece }
    }
  }
}
