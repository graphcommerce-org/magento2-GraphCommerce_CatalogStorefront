{
  products(filter: { sku: { eq: "240-LV09" } }) {
    items {
      uid sku name __typename
      ... on DownloadableProduct {
        links_purchased_separately
        downloadable_product_links { title price sort_order uid }
        downloadable_product_samples { title sort_order }
      }
      price_range { minimum_price { final_price { value } } maximum_price { final_price { value } } }
    }
  }
}
