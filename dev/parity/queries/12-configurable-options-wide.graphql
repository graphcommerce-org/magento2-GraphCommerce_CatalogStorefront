{
  products(filter: { category_id: { eq: "{{category_id:configurable}}" } }, pageSize: 100) {
    items {
      sku __typename stock_status rating_summary review_count
      ... on ConfigurableProduct {
        configurable_options {
          uid attribute_code label position
          values { value_index uid label store_label default_label use_default_value swatch_data { __typename value } }
        }
      }
    }
  }
}
